  <g stroke="#8fb0ff" stroke-opacity="0.45" stroke-width="1">
    <path d="M35 52 L30 80 M46 52 L46 80 M57 52 L62 80"/>
    <path d="M20.7 61.3 H71.3 M17.3 70.7 H74.7"/>
