    <path d="M64 8 V12 M64 44 V48 M44 28 H48 M80 28 H84 M49.9 13.9 L52.7 16.7 M75.3 39.3 L78.1 42.1 M49.9 42.1 L52.7 39.3 M75.3 16.7 L78.1 13.9"/>
