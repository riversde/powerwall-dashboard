<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Solar" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="pf-sun-core" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#fff3c2"/><stop offset="0.6" stop-color="#f5c542"/><stop offset="1" stop-color="#e09a1a"/>
    </radialGradient>
    <radialGradient id="pf-sun-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5c542" stop-opacity="0.45"/><stop offset="1" stop-color="#f5c542" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pf-panel" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#2f4a8a"/><stop offset="1" stop-color="#16244a"/>
    </linearGradient>
    <linearGradient id="pf-panel-sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.35" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.22"/><stop offset="0.65" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- sun -->
  <circle cx="64" cy="28" r="24" fill="url(#pf-sun-halo)"/>
  <g stroke="#f5c542" stroke-width="2" stroke-linecap="round">
