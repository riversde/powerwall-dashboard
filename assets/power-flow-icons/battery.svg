<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Battery" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    Set charge level with JS (0-100):
      svg.querySelector('#pf-batt-level').setAttribute('transform', `translate(35 ${77 - 54 * pct / 100})`);
    Default below = 72%.
  -->
  <defs>
    <linearGradient id="pf-batt-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb870"/><stop offset="0.5" stop-color="#f08a3c"/><stop offset="1" stop-color="#b8531c"/>
    </linearGradient>
    <linearGradient id="pf-batt-shell" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a3350"/><stop offset="0.5" stop-color="#1a2240"/><stop offset="1" stop-color="#2a3350"/>
    </linearGradient>
    <radialGradient id="pf-batt-halo" cx="0.5" cy="0.6" r="0.5">
      <stop offset="0" stop-color="#f08a3c" stop-opacity="0.3"/><stop offset="1" stop-color="#f08a3c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="pf-batt-clip"><rect x="35" y="23" width="26" height="54" rx="5"/></clipPath>
    <filter id="pf-batt-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="48" cy="52" r="44" fill="url(#pf-batt-halo)"/>
  <ellipse cx="48" cy="86" rx="20" ry="2.5" fill="#000" opacity="0.35"/>
  <!-- terminal -->
  <rect x="40" y="10" width="16" height="8" rx="2.5" fill="#3a4568" stroke="#f0a36a" stroke-opacity="0.6" stroke-width="1.2"/>
  <!-- shell -->
  <rect x="30" y="17" width="36" height="66" rx="9" fill="url(#pf-batt-shell)" stroke="#f0a36a" stroke-opacity="0.7" stroke-width="1.6"/>
  <rect x="35" y="23" width="26" height="54" rx="5" fill="#0c1222"/>
  <!-- charge liquid -->
  <g clip-path="url(#pf-batt-clip)">
    <g id="pf-batt-level" transform="translate(35 38.1)">
      <path d="M0 0 Q6.5 -2.6 13 0 T26 0 T39 0 T52 0 V60 H0 Z" fill="url(#pf-batt-fill)">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-26 0" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- glass highlight -->
    <rect x="37.5" y="25" width="4" height="50" rx="2" fill="#fff" opacity="0.12"/>
  </g>
  <!-- bolt -->
  <path d="M51 38 L42 52 H48 L45 62 L54 48 H48 Z" fill="#fff6e8" stroke="#7a3510" stroke-width="1" stroke-linejoin="round" filter="url(#pf-batt-glow)"/>
</svg>
