<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Home" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="pf-home-roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9ccff"/><stop offset="1" stop-color="#6a82d6"/>
    </linearGradient>
    <linearGradient id="pf-home-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26345a"/><stop offset="1" stop-color="#151e36"/>
    </linearGradient>
    <radialGradient id="pf-home-halo" cx="0.5" cy="0.6" r="0.5">
      <stop offset="0" stop-color="#ffcf73" stop-opacity="0.28"/><stop offset="1" stop-color="#ffcf73" stop-opacity="0"/>
    </radialGradient>
    <filter id="pf-home-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="48" cy="54" r="44" fill="url(#pf-home-halo)"/>
  <ellipse cx="48" cy="83" rx="31" ry="3" fill="#000" opacity="0.35"/>
  <!-- chimney -->
  <rect x="61" y="24" width="7" height="15" rx="1.5" fill="#22304f" stroke="#8aa4ff" stroke-opacity="0.55" stroke-width="1.2"/>
  <!-- walls -->
  <path d="M22 45 L48 25 L74 45 V81 H22 Z" fill="url(#pf-home-wall)" stroke="#8aa4ff" stroke-opacity="0.5" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- roof -->
  <path d="M14 48 L48 20 L82 48" fill="none" stroke="url(#pf-home-roof)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- energy badge -->
  <circle cx="48" cy="39" r="5.8" fill="#0f172a" stroke="#f5c542" stroke-width="1.3"/>
  <path d="M49.2 35.2 L45.6 39.8 H48.1 L46.8 42.9 L50.4 38.3 H47.9 Z" fill="#f5c542"/>
  <!-- lit windows -->
  <g filter="url(#pf-home-glow)">
    <rect x="28.5" y="51" width="12" height="11" rx="2" fill="#ffc861">
      <animate attributeName="opacity" values="1;0.78;1" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="55.5" y="51" width="12" height="11" rx="2" fill="#ffc861">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g stroke="#7a5418" stroke-width="1" opacity="0.7">
    <path d="M34.5 51 V62 M28.5 56.5 H40.5"/>
    <path d="M61.5 51 V62 M55.5 56.5 H67.5"/>
  </g>
  <!-- door -->
  <path d="M43 81 V67.5 a5 5 0 0 1 10 0 V81 Z" fill="#0d1426" stroke="#8aa4ff" stroke-opacity="0.6" stroke-width="1.2"/>
  <circle cx="50.6" cy="74.5" r="0.9" fill="#ffc861"/>
</svg>
