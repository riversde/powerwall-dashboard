<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Grid" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="pf-grid-steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9c4ff"/><stop offset="1" stop-color="#4c6fbf"/>
    </linearGradient>
    <radialGradient id="pf-grid-halo" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#4c8dff" stop-opacity="0.28"/><stop offset="1" stop-color="#4c8dff" stop-opacity="0"/>
    </radialGradient>
    <filter id="pf-grid-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="pf-grid-wire-a" d="M2 36 Q14 40 26 31 Q48 38 70 31 Q82 40 94 36"/>
    <path id="pf-grid-wire-b" d="M2 50 Q16 54 30 45 Q48 51 66 45 Q80 54 94 50"/>
  </defs>
  <circle cx="48" cy="46" r="44" fill="url(#pf-grid-halo)"/>
  <ellipse cx="48" cy="86" rx="22" ry="2.5" fill="#000" opacity="0.35"/>
  <!-- wires -->
  <g fill="none" stroke="#6f93e0" stroke-opacity="0.55" stroke-width="1.1">
    <use href="#pf-grid-wire-a"/><use href="#pf-grid-wire-b"/>
  </g>
  <!-- tower -->
  <g fill="none" stroke="url(#pf-grid-steel)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M44 14 L34 85 M52 14 L62 85" stroke-width="2.6"/>
    <path d="M44 14 L48 7 L52 14 Z" stroke-width="2" fill="#1a2440"/>
    <path d="M24 27 H72 M28 41 H68" stroke-width="2.6"/>
    <path d="M44 14 L53.7 27 M52 14 L42.3 27 M42.3 27 L55.7 41 M53.7 27 L40.3 41 M40.3 41 L58.3 59 M55.7 41 L37.7 59 M37.7 59 L62 85 M58.3 59 L34 85 M37.7 59 H58.3" stroke-width="1.3" stroke-opacity="0.8"/>
  </g>
  <!-- insulators -->
  <g fill="#cfe0ff">
    <rect x="25" y="27" width="2" height="4" rx="1"/><rect x="69" y="27" width="2" height="4" rx="1"/>
    <rect x="29" y="41" width="2" height="4" rx="1"/><rect x="65" y="41" width="2" height="4" rx="1"/>
  </g>
  <!-- flowing energy -->
  <g filter="url(#pf-grid-glow)" fill="#7fb0ff">
    <circle r="1.8"><animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#pf-grid-wire-a"/></animateMotion></circle>
    <circle r="1.8"><animateMotion dur="2.8s" begin="-1.4s" repeatCount="indefinite"><mpath href="#pf-grid-wire-a"/></animateMotion></circle>
    <circle r="1.8"><animateMotion dur="3.4s" begin="-0.7s" repeatCount="indefinite"><mpath href="#pf-grid-wire-b"/></animateMotion></circle>
  </g>
</svg>
